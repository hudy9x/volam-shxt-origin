<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Võ Lâm Truyền Kỳ - Thư Viện Kỹ Năng (.SPR) [Mặc định 13 FPS]</title>
  <style>
    :root {
      --bg-body: #0d0e12;
      --bg-card: #16181f;
      --border-card: #272a38;
      --border-hover: #eab308;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #eab308;
      --box-canvas-bg: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #12141a;
      border-bottom: 1px solid var(--border-card);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .top-bar {
      max-width: 1700px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group h1 span.pill {
      font-size: 11px;
      font-weight: 600;
      background: linear-gradient(135deg, #d97706, #eab308);
      color: #000;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .title-group p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .search-box {
      position: relative;
      min-width: 240px;
    }
    .search-box input {
      width: 100%;
      background: #1c1f2b;
      border: 1px solid #2e3447;
      border-radius: 8px;
      color: #fff;
      padding: 7px 12px 7px 34px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.25);
    }
    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    select, button {
      background: #1c1f2b;
      border: 1px solid #2e3447;
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: #434c68;
    }
    button.active {
      background: #ca8a04;
      border-color: #eab308;
      color: #000;
      font-weight: 600;
    }

    /* FPS Control Bar (Special Feature) */
    .fps-control-bar {
      max-width: 1700px;
      margin: 0 auto;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: #0f1117;
      border-top: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .fps-slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .fps-label {
      font-size: 12px;
      font-weight: 600;
      color: #eab308;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fps-badge {
      background: #ca8a04;
      color: #000;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      min-width: 58px;
      text-align: center;
    }
    .fps-slider {
      width: 140px;
      accent-color: #eab308;
      cursor: pointer;
    }
    .fps-presets {
      display: flex;
      gap: 4px;
    }
    .fps-btn {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 6px;
      background: #1b1e2a;
      border: 1px solid #2e3447;
      color: #94a3b8;
    }
    .fps-btn.active {
      background: #ca8a04;
      color: #000;
      font-weight: 700;
      border-color: #eab308;
    }

    .play-pause-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
      background: #232738;
      border: 1px solid #353b52;
    }
    .play-pause-btn:hover { background: #30364c; }

    .filter-tabs {
      max-width: 1700px;
      margin: 0 auto;
      padding: 8px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid #282c3c;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-btn:hover {
      background: #1e2230;
      color: #fff;
    }
    .tab-btn.active {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #eab308;
      font-weight: 600;
    }
    .tab-btn .count {
      font-size: 10px;
      opacity: 0.7;
      background: rgba(255,255,255,0.1);
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* Sub-bar for Display Options */
    .view-toolbar {
      max-width: 1700px;
      margin: 0 auto;
      padding: 6px 24px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .view-mode-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bg-toggles {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bg-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #333;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .bg-circle:hover { transform: scale(1.15); }
    .bg-circle.active { border-color: #eab308; }
    .bg-black { background: #000; }
    .bg-dark { background: #1c1f2b; }
    .bg-grid {
      background: repeating-conic-gradient(#222 0% 25%, #333 0% 50%) 50% / 10px 10px;
    }
    .bg-white { background: #ffffff; }

    /* Main Container */
    main {
      max-width: 1700px;
      margin: 0 auto;
      padding: 16px 24px 60px 24px;
      width: 100%;
      flex: 1;
    }

    /* Grid Layout - Uniform Grid Mode */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      align-items: start;
    }

    /* Proportional Mode - Square Box Sized to Sprite */
    .grid-container.proportional-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .spr-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }
    .spr-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }

    /* Square Canvas Box: User specifically requested each in a box sized based on its dimensions */
    .canvas-box-wrap {
      background: var(--box-canvas-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border-card);
      transition: background 0.2s;
    }

    /* Default Uniform Grid Canvas Box */
    .grid-container:not(.proportional-mode) .canvas-box-wrap {
      width: 100%;
      height: 240px;
    }

    /* Proportional Canvas Box: Dimensions derived from sprite */
    .grid-container.proportional-mode .spr-card {
      width: calc(var(--box-w, 240px) * var(--zoom-scale, 1));
      max-width: 100%;
    }

    .grid-container.proportional-mode .canvas-box-wrap {
      width: 100%;
      height: calc(var(--box-h, 240px) * var(--zoom-scale, 1));
      min-height: 120px;
    }

    .canvas-box-wrap canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.06));
    }

    /* Dimension Overlay Badge */
    .dim-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-size: 11px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .frame-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .fps-indicator-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      font-size: 10px;
      font-family: monospace;
      padding: 2px 5px;
      border-radius: 4px;
      pointer-events: none;
    }

    /* Card Info */
    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sect-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .skill-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .file-name {
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: #14161f;
      border: 1px solid #2e3447;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 20px;
      border-bottom: 1px solid #232738;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 {
      font-size: 17px;
      color: #fff;
    }
    .modal-close {
      background: #1f2333;
      border: none;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .modal-close:hover { color: #fff; background: #323850; }

    .modal-preview-area {
      background: #000;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #232738;
      padding: 20px;
    }
    .modal-preview-area canvas {
      max-width: 100%;
      max-height: 440px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .modal-player-bar {
      width: 100%;
      max-width: 600px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #12141c;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #232738;
    }

    .modal-details {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .detail-item {
      background: #1b1e2a;
      border: 1px solid #262a3c;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .detail-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      font-family: monospace;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
      font-size: 16px;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="title-group">
      <h1>
        Võ Lâm Truyền Kỳ (.SPR)
        <span class="pill">257 Skills</span>
      </h1>
      <p>Thư viện xem trước và điều chỉnh hoạt cảnh kỹ năng trích xuất từ <code>skills.pak</code></p>
    </div>

    <div class="controls-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Tìm tên skill, file .spr, môn phái...">
      </div>

      <select id="sortSelect">
        <option value="sect">Sắp xếp: Theo môn phái</option>
        <option value="size_desc">Kích thước: Lớn nhất trước</option>
        <option value="size_asc">Kích thước: Nhỏ nhất trước</option>
        <option value="frames_desc">Số frames: Nhiều nhất trước</option>
        <option value="name">Tên file (A-Z)</option>
      </select>
    </div>
  </div>

  <!-- FPS Adjustment Bar (Mặc định 13 FPS) -->
  <div class="fps-control-bar">
    <div class="fps-slider-group">
      <span class="fps-label">
        ⚡ Tốc độ khung hình (FPS):
      </span>
      <span class="fps-badge" id="fpsDisplay">13 fps</span>
      <input type="range" class="fps-slider" id="fpsSlider" min="1" max="60" value="13" step="1">
      <div class="fps-presets">
        <button class="fps-btn" data-fps="5">5 fps</button>
        <button class="fps-btn" data-fps="10">10 fps</button>
        <button class="fps-btn active" data-fps="13">13 fps (Chuẩn VLTK)</button>
        <button class="fps-btn" data-fps="20">20 fps</button>
        <button class="fps-btn" data-fps="30">30 fps</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="play-pause-btn" id="globalPlayPauseBtn">
        <span id="playPauseIcon">⏸</span>
        <span id="playPauseText">Tạm dừng</span>
      </button>
    </div>
  </div>

  <div class="filter-tabs" id="sectTabs">
    <!-- Populated by JS -->
  </div>

  <div class="view-toolbar">
    <div class="view-mode-group">
      <span>Chế độ ô vuông:</span>
      <button id="btnModeProp" class="active" title="Mỗi sprite nằm trong ô vuông có kích thước tương ứng độ phân giải">
        📐 Theo kích thước thật
      </button>
      <button id="btnModeGrid" title="Tất cả sprite nằm trong lưới kích thước đồng đều">
        ▦ Lưới đồng đều
      </button>
      <div style="margin-left: 12px; display: inline-flex; align-items: center; gap: 6px;">
        <label for="zoomRange">Zoom:</label>
        <input type="range" id="zoomRange" min="0.5" max="1.8" step="0.1" value="1.0" style="width: 100px; accent-color: #eab308;">
        <span id="zoomVal" style="font-family: monospace;">1.0x</span>
      </div>
    </div>

    <div class="bg-toggles">
      <span>Nền hiển thị:</span>
      <div class="bg-circle bg-black active" data-bg="#000000" title="Nền Đen (Mặc định - hiển thị hiệu ứng phát sáng đẹp nhất)"></div>
      <div class="bg-circle bg-dark" data-bg="#1c1f2b" title="Nền Xám Đậm"></div>
      <div class="bg-circle bg-grid" data-bg="grid" title="Nền Lưới Trong Suốt (Alpha Checkerboard)"></div>
      <div class="bg-circle bg-white" data-bg="#ffffff" title="Nền Trắng"></div>
    </div>
  </div>
</header>

<main>
  <div class="grid-container proportional-mode" id="sprGrid">
    <!-- Sprites injected here -->
  </div>
</main>

<!-- Modal Player -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modalTitle">Chi tiết Kỹ Năng</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-preview-area" id="modalPreview">
      <canvas id="modalCanvas"></canvas>
      <div class="modal-player-bar">
        <button id="modalPlayPause" class="fps-btn">⏸ Dừng</button>
        <button id="modalPrevFrame" class="fps-btn">◀ Frame</button>
        <span id="modalFrameIndicator" style="font-family: monospace; font-size: 12px; color: #eab308;">Frame: 0 / 0</span>
        <button id="modalNextFrame" class="fps-btn">Frame ▶</button>
        <input type="range" id="modalTimeline" min="0" max="10" value="0" style="flex: 1; accent-color: #eab308; cursor: pointer;">
      </div>
    </div>
    <div class="modal-details" id="modalDetails">
      <!-- Injected -->
    </div>
  </div>
</div>

me": "远程攻击.spr", "rel_path": "补充/远程攻击.spr", "sect": "Kỹ Năng Bổ Sung", "sect_color": "#a855f7", "skill_vi": "C?ng kích vât lý gấn", "skill_id": "65", "width": 160, "height": 120, "max_dim": 160, "frames": 16, "dirs": 16, "frames_per_dir": 1, "rendered_frames": 1, "cols": 1, "rows": 1, "interval": 1, "file_size": 5584, "webp_url": "Client_VLTK_SHXT/data/skills/preview/补充_远程攻击.webp", "png_url": "Client_VLTK_SHXT/data/skills/preview/补充_远程攻击.png", "sheet_url": "Client_VLTK_SHXT/data/skills/preview/补充_远程攻击_sheet.webp"}, {"id": 257, "file_name": "飞标爆炸.spr", "rel_path": "补充/飞标爆炸.spr", "sect": "Kỹ Năng Bổ Sung", "sect_color": "#a855f7", "skill_vi": "Tiều Lý Phi ?ao", "skill_id": "106", "width": 140, "height": 140, "max_dim": 140, "frames": 4, "dirs": 1, "frames_per_dir": 4, "rendered_frames": 4, "cols": 4, "rows": 1, "interval": 20, "file_size": 7053, "webp_url": "Client_VLTK_SHXT/data/skills/preview/补充_飞标爆炸.webp", "png_url": "Client_VLTK_SHXT/data/skills/preview/补充_飞标爆炸.png", "sheet_url": "Client_VLTK_SHXT/data/skills/preview/补充_飞标爆炸_sheet.webp"}];

  const sprGrid = document.getElementById('sprGrid');
  const sectTabs = document.getElementById('sectTabs');
  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const btnModeProp = document.getElementById('btnModeProp');
  const btnModeGrid = document.getElementById('btnModeGrid');
  const zoomRange = document.getElementById('zoomRange');
  const zoomVal = document.getElementById('zoomVal');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalClose = document.getElementById('modalClose');

  const fpsSlider = document.getElementById('fpsSlider');
  const fpsDisplay = document.getElementById('fpsDisplay');
  const globalPlayPauseBtn = document.getElementById('globalPlayPauseBtn');
  const playPauseIcon = document.getElementById('playPauseIcon');
  const playPauseText = document.getElementById('playPauseText');

  // Animation Engine State
  let globalFps = 13; // Default 13 FPS
  let isPlaying = true;
  let currentSect = 'ALL';
  let currentSearch = '';
  let currentSort = 'sect';
  let isProportional = true;
  let zoomScale = 1.0;
  let currentBg = '#000000';

  // Loaded Spritesheet Image Cache
  const sheetCache = {};
  function getSheetImage(url) {
    if (!sheetCache[url]) {
      const img = new Image();
      img.src = url;
      sheetCache[url] = img;
    }
    return sheetCache[url];
  }

  // Item map for 100% fail-safe lookup
  const itemMap = new Map(SPR_DATA.map(it => [String(it.id), it]));

  // Active Canvases tracking for IntersectionObserver
  const activeCards = new Map(); // canvas element -> item metadata
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const card = entry.target;
      const canvas = card.querySelector('canvas');
      if (!canvas) return;
      const item = canvas._itemData || itemMap.get(String(canvas.dataset.id));
      if (entry.isIntersecting && item) {
        activeCards.set(canvas, item);
        drawCardFrame(canvas, item, globalFrameTick);
      } else {
        activeCards.delete(canvas);
      }
    });
  }, { rootMargin: '200px' });

  // Main Animation Loop
  let lastTimestamp = performance.now();
  let accumulatedTime = 0;
  let globalFrameTick = 0;

  function animLoop(now) {
    const delta = now - lastTimestamp;
    lastTimestamp = now;

    if (isPlaying) {
      accumulatedTime += delta;
      const frameDuration = 1000 / globalFps;

      if (accumulatedTime >= frameDuration) {
        const advanceCount = Math.floor(accumulatedTime / frameDuration);
        accumulatedTime %= frameDuration;
        globalFrameTick += advanceCount;

        // Render visible cards
        activeCards.forEach((item, canvas) => {
          if (canvas && item) {
            drawCardFrame(canvas, item, globalFrameTick);
          }
        });

        // Render Modal if open
        if (modalActiveItem && modalCanvas) {
          drawModalFrame(modalActiveItem, globalFrameTick);
        }
      }
    }

    requestAnimationFrame(animLoop);
  }
  requestAnimationFrame(animLoop);

  function drawCardFrame(canvas, item, tick) {
    if (!canvas || !item || !item.sheet_url) return;
    const img = getSheetImage(item.sheet_url);
    if (!img.complete || img.naturalWidth === 0) return;

    const frameIdx = tick % item.rendered_frames;
    const col = frameIdx % item.cols;
    const row = Math.floor(frameIdx / item.cols);

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, item.width, item.height);
    ctx.drawImage(img, col * item.width, row * item.height, item.width, item.height, 0, 0, item.width, item.height);
  }

  // FPS Controls
  function updateFps(fps) {
    globalFps = parseInt(fps);
    fpsSlider.value = globalFps;
    fpsDisplay.textContent = `${globalFps} fps`;

    document.querySelectorAll('.fps-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.fps) === globalFps);
    });

    document.querySelectorAll('.fps-indicator-badge').forEach(badge => {
      badge.textContent = `${globalFps} fps`;
    });
  }

  fpsSlider.oninput = (e) => updateFps(e.target.value);
  document.querySelectorAll('.fps-btn[data-fps]').forEach(btn => {
    btn.onclick = () => updateFps(btn.dataset.fps);
  });

  globalPlayPauseBtn.onclick = () => {
    isPlaying = !isPlaying;
    playPauseIcon.textContent = isPlaying ? '⏸' : '▶';
    playPauseText.textContent = isPlaying ? 'Tạm dừng' : 'Tiếp tục';
    globalPlayPauseBtn.classList.toggle('active', !isPlaying);
  };

  // Build Sect Tabs
  const sects = {};
  SPR_DATA.forEach(item => {
    sects[item.sect] = (sects[item.sect] || 0) + 1;
  });

  const allTab = document.createElement('button');
  allTab.className = 'tab-btn active';
  allTab.innerHTML = `Tất cả <span class="count">${SPR_DATA.length}</span>`;
  allTab.onclick = () => selectSect('ALL');
  sectTabs.appendChild(allTab);

  Object.entries(sects).sort((a,b) => b[1] - a[1]).forEach(([sName, count]) => {
    const tab = document.createElement('button');
    tab.className = 'tab-btn';
    tab.dataset.sect = sName;
    tab.innerHTML = `${sName} <span class="count">${count}</span>`;
    tab.onclick = () => selectSect(sName);
    sectTabs.appendChild(tab);
  });

  function selectSect(sName) {
    currentSect = sName;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', (sName === 'ALL' && !btn.dataset.sect) || btn.dataset.sect === sName);
    });
    render();
  }

  function getFilteredData() {
    let list = SPR_DATA.filter(item => {
      if (currentSect !== 'ALL' && item.sect !== currentSect) return false;
      if (currentSearch) {
        const q = currentSearch.toLowerCase();
        const text = `${item.file_name} ${item.skill_vi} ${item.sect} ${item.rel_path}`.toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    });

    list.sort((a, b) => {
      if (currentSort === 'sect') return a.sect.localeCompare(b.sect) || a.file_name.localeCompare(b.file_name);
      if (currentSort === 'size_desc') return b.max_dim - a.max_dim;
      if (currentSort === 'size_asc') return a.max_dim - b.max_dim;
      if (currentSort === 'frames_desc') return b.frames - a.frames;
      if (currentSort === 'name') return a.file_name.localeCompare(b.file_name);
      return 0;
    });

    return list;
  }

  function render() {
    observer.disconnect();
    activeCards.clear();
    const list = getFilteredData();
    sprGrid.innerHTML = '';

    if (list.length === 0) {
      sprGrid.innerHTML = `<div class="empty-state">Không tìm thấy file .spr nào phù hợp với bộ lọc hiện tại.</div>`;
      return;
    }

    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'spr-card';
      const boxW = Math.max(120, item.width);
      const boxH = Math.max(120, item.height);
      card.style.setProperty('--box-w', `${boxW}px`);
      card.style.setProperty('--box-h', `${boxH}px`);
      card.style.setProperty('--zoom-scale', zoomScale);

      const bgStyle = currentBg === 'grid' 
        ? 'background: repeating-conic-gradient(#222 0% 25%, #333 0% 50%) 50% / 10px 10px;' 
        : 'background:' + currentBg;

      card.innerHTML = `
        <div class="canvas-box-wrap" style="${bgStyle}">
          <canvas width="${item.width}" height="${item.height}" data-id="${item.id}"></canvas>
          <span class="frame-badge">${item.frames}f (${item.dirs}h)</span>
          <span class="fps-indicator-badge">${globalFps} fps</span>
          <span class="dim-badge">${item.width} × ${item.height}</span>
        </div>
        <div class="card-body">
          <div class="card-header-row">
            <span class="sect-tag" style="color: ${item.sect_color};">${item.sect}</span>
            ${item.skill_id !== '-' ? `<span style="font-size: 11px; color: #94a3b8; font-family: monospace;">ID: ${item.skill_id}</span>` : ''}
          </div>
          <div class="skill-title" title="${item.skill_vi}">${item.skill_vi}</div>
          <div class="file-name" title="${item.rel_path}">${item.file_name}</div>
          <div class="card-footer">
            <span>${(item.file_size / 1024).toFixed(1)} KB</span>
            <span>${item.rendered_frames} frames / loop</span>
          </div>
        </div>
      `;

      const canvas = card.querySelector('canvas');
      canvas._itemData = item;

      // Pre-draw representative first frame when image is ready
      const img = getSheetImage(item.sheet_url);
      if (img.complete && img.naturalWidth > 0) {
        drawCardFrame(canvas, item, 0);
      } else {
        img.addEventListener('load', () => drawCardFrame(canvas, item, 0), { once: true });
      }

      card.onclick = () => openModal(item);
      sprGrid.appendChild(card);
      observer.observe(card);
    });
  }

  // Modal Player Implementation
  let modalActiveItem = null;
  const modalCanvas = document.getElementById('modalCanvas');
  const modalPlayPause = document.getElementById('modalPlayPause');
  const modalPrevFrame = document.getElementById('modalPrevFrame');
  const modalNextFrame = document.getElementById('modalNextFrame');
  const modalTimeline = document.getElementById('modalTimeline');
  const modalFrameIndicator = document.getElementById('modalFrameIndicator');
  let modalManualFrame = 0;
  let modalIsPlaying = true;

  function openModal(item) {
    modalActiveItem = item;
    modalManualFrame = 0;
    modalIsPlaying = true;
    modalPlayPause.textContent = '⏸ Dừng';

    document.getElementById('modalTitle').textContent = `${item.skill_vi} (${item.file_name})`;
    modalCanvas.width = item.width;
    modalCanvas.height = item.height;

    modalTimeline.max = item.rendered_frames - 1;
    modalTimeline.value = 0;
    modalFrameIndicator.textContent = `Frame: 1 / ${item.rendered_frames}`;

    drawModalFrame(item, 0);

    const details = document.getElementById('modalDetails');
    details.innerHTML = `
      <div class="detail-item">
        <div class="detail-label">Tên Tiếng Việt</div>
        <div class="detail-value" style="color: #eab308;">${item.skill_vi}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Môn Phái</div>
        <div class="detail-value" style="color: ${item.sect_color};">${item.sect}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Kích thước Canvas</div>
        <div class="detail-value">${item.width} × ${item.height} px</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Tổng Frames / Số Hướng</div>
        <div class="detail-value">${item.frames} frames / ${item.dirs} hướng (${item.frames_per_dir} f/h)</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Tốc độ hiển thị</div>
        <div class="detail-value">${globalFps} FPS (1 frame = ${(1000/globalFps).toFixed(1)} ms)</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Dung lượng File SPR</div>
        <div class="detail-value">${(item.file_size / 1024).toFixed(2)} KB</div>
      </div>
      <div class="detail-item" style="grid-column: 1 / -1;">
        <div class="detail-label">Đường dẫn tương đối</div>
        <div class="detail-value" style="font-size: 12px; word-break: break-all;">data/skills/${item.rel_path}</div>
      </div>
    `;

    modalBackdrop.classList.add('open');
  }

  function drawModalFrame(item, tick) {
    if (!item) return;
    const img = getSheetImage(item.sheet_url);
    if (!img.complete || img.naturalWidth === 0) return;

    let fIdx = modalIsPlaying ? (tick % item.rendered_frames) : modalManualFrame;
    modalManualFrame = fIdx;
    modalTimeline.value = fIdx;
    modalFrameIndicator.textContent = `Frame: ${fIdx + 1} / ${item.rendered_frames}`;

    const col = fIdx % item.cols;
    const row = Math.floor(fIdx / item.cols);

    const ctx = modalCanvas.getContext('2d');
    ctx.clearRect(0, 0, item.width, item.height);
    ctx.drawImage(img, col * item.width, row * item.height, item.width, item.height, 0, 0, item.width, item.height);
  }

  modalPlayPause.onclick = () => {
    modalIsPlaying = !modalIsPlaying;
    modalPlayPause.textContent = modalIsPlaying ? '⏸ Dừng' : '▶ Chạy';
  };

  modalPrevFrame.onclick = () => {
    if (!modalActiveItem) return;
    modalIsPlaying = false;
    modalPlayPause.textContent = '▶ Chạy';
    modalManualFrame = (modalManualFrame - 1 + modalActiveItem.rendered_frames) % modalActiveItem.rendered_frames;
    drawModalFrame(modalActiveItem, modalManualFrame);
  };

  modalNextFrame.onclick = () => {
    if (!modalActiveItem) return;
    modalIsPlaying = false;
    modalPlayPause.textContent = '▶ Chạy';
    modalManualFrame = (modalManualFrame + 1) % modalActiveItem.rendered_frames;
    drawModalFrame(modalActiveItem, modalManualFrame);
  };

  modalTimeline.oninput = (e) => {
    if (!modalActiveItem) return;
    modalIsPlaying = false;
    modalPlayPause.textContent = '▶ Chạy';
    modalManualFrame = parseInt(e.target.value);
    drawModalFrame(modalActiveItem, modalManualFrame);
  };

  modalClose.onclick = () => {
    modalBackdrop.classList.remove('open');
    modalActiveItem = null;
  };
  modalBackdrop.onclick = (e) => {
    if (e.target === modalBackdrop) {
      modalBackdrop.classList.remove('open');
      modalActiveItem = null;
    }
  };

  // Search and Sort
  searchInput.oninput = (e) => {
    currentSearch = e.target.value.trim();
    render();
  };

  sortSelect.onchange = (e) => {
    currentSort = e.target.value;
    render();
  };

  // View Mode Toggles
  btnModeProp.onclick = () => {
    isProportional = true;
    btnModeProp.classList.add('active');
    btnModeGrid.classList.remove('active');
    sprGrid.classList.add('proportional-mode');
    render();
  };

  btnModeGrid.onclick = () => {
    isProportional = false;
    btnModeGrid.classList.add('active');
    btnModeProp.classList.remove('active');
    sprGrid.classList.remove('proportional-mode');
    render();
  };

  // Zoom
  zoomRange.oninput = (e) => {
    zoomScale = parseFloat(e.target.value);
    zoomVal.textContent = `${zoomScale.toFixed(1)}x`;
    document.querySelectorAll('.spr-card').forEach(c => {
      c.style.setProperty('--zoom-scale', zoomScale);
    });
  };

  // Background Switcher
  document.querySelectorAll('.bg-circle').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.bg-circle').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBg = btn.dataset.bg;
      document.querySelectorAll('.canvas-box-wrap').forEach(box => {
        if (currentBg === 'grid') {
          box.style.background = 'repeating-conic-gradient(#222 0% 25%, #333 0% 50%) 50% / 10px 10px';
        } else {
          box.style.background = currentBg;
        }
      });
    };
  });

  // Initial render
  render();
</script>
